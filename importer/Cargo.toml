[package]
name = "runsync"
version = "0.1.0"
edition = "2024"
description = "Garmin importer: raw archive and SQLite analysis database"
license = "MIT"
publish = false

[[bin]]
name = "runsync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
fitparser = "0.11.0"
indicatif = "0.18.6"
log = "0.4"
reqwest = { version = "0.13.5", features = ["blocking"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2.0.21"
toml = "0.9"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
