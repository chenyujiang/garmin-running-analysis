[project]
name = "running"
version = "0.1.0"
description = "Running analysis over the runsync analysis database, plus a local dashboard"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.4",
    "fastapi>=0.115",
    "polars>=1.30",
    "uvicorn>=0.34",
]

[project.scripts]
running-dashboard = "running.dashboard.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jupyterlab>=4.4",
    "nbstripout>=0.8",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
